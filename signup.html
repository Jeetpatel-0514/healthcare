<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up Page</title>
    <style>
        /* Global styles */
        body {
            font-family: Arial, sans-serif;
            background-color: #e6f7e6;
            /* Light green background */
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-image: url("/loginbackground.jpg");
        }

        .container {
            background-color: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            width: 80%;
            max-width: 400px;
            /* Narrower for a single form */
        }

        .form-section {
            padding: 20px;
            border: 2px solid #007BFF;
            /* Blue border */
            border-radius: 8px;
            background-color: #f0f8ff;
            /* Light blue background for forms */
        }

        h1 {
            color: #007BFF;
            text-align: center;
        }

        h2 {
            color: #28A745;
            /* Green for headings */
            text-align: center;
        }

        label {
            display: block;
            margin: 10px 0 5px;
            color: #007BFF;
            /* Blue for labels */
        }

        input[type="text"],
        input[type="email"],
        input[type="password"] {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #28A745;
            /* Green border for inputs */
            border-radius: 4px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 10px;
            background-color: #007BFF;
            /* Blue button background */
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        button:hover {
            background-color: #0056b3;
            /* Darker blue on hover */
        }

        .success-message {
            color: #28A745;
            /* Green for success messages */
            text-align: center;
            margin-top: 10px;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="form-section">
            <h1>Smart Healthcare</h1>
            <h2>Sign Up</h2>
            <form id="signupForm">
                <label for="signupUsername">Username:</label>
                <input type="text" id="signupUsername" required>

                <label for="signupEmail">Email:</label>
                <input type="email" id="signupEmail" required>

                <label for="signupPassword">Password:</label>
                <input type="password" id="signupPassword" required>

                <label for="signupConfirmPassword">Confirm Password:</label>
                <input type="password" id="signupConfirmPassword" required>

                <button type="submit">Sign Up</button>
                <div id="signupMessage" class="success-message"></div>
            </form>
        </div>
    </div>

    <script>
        document.getElementById('signupForm').addEventListener('submit', async function (event) {
            event.preventDefault();
            const username = document.getElementById('signupUsername').value.trim();
            const email = document.getElementById('signupEmail').value.trim();
            const password = document.getElementById('signupPassword').value;
            const confirmPassword = document.getElementById('signupConfirmPassword').value;

            const msgEl = document.getElementById('signupMessage');
            msgEl.innerText = '';

            if (!username || !email || !password || !confirmPassword) {
                msgEl.innerText = 'Please fill in all fields.';
                return;
            }
            if (password !== confirmPassword) {
                msgEl.innerText = 'Passwords do not match.';
                return;
            }

            try {
                const res = await fetch('/api/signup', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({ username, email, password })
                });
                const data = await res.json();
                if (res.ok) {
                    msgEl.style.color = '#28A745';
                    msgEl.innerText = 'Sign-up successful! Redirecting...';
                    setTimeout(() => { window.location.href = '/index.html'; }, 1000);
                } else {
                    msgEl.style.color = 'red';
                    msgEl.innerText = data.error || 'Sign-up failed';
                }
            } catch (err) {
                msgEl.style.color = 'red';
                msgEl.innerText = 'Network error';
            }
        });
    </script>
</body>

</html>
