<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doctor Portal - Smart Healthcare</title>
    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        .login-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--light-gray);
            background-image: url("/new_login_bg.jpg");
            background-size: cover;
            background-position: center;
            padding: 40px 20px;
        }
        .login-card {
            background: rgba(255, 255, 255, 0.95);
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 450px;
        }
        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }
        .login-header i {
            font-size: 3rem;
            color: var(--primary-color);
            margin-bottom: 10px;
        }
        .login-header h2 {
            color: var(--dark-gray);
        }
        .form-tabs {
            display: flex;
            margin-bottom: 25px;
            border-bottom: 2px solid #eee;
        }
        .form-tabs button {
            flex: 1;
            padding: 10px;
            background: none;
            border: none;
            font-family: 'Poppins', sans-serif;
            font-weight: 600;
            color: #777;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .form-tabs button.active {
            color: var(--primary-color);
            border-bottom: 2px solid var(--primary-color);
            margin-bottom: -2px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group select,
        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-family: 'Poppins', sans-serif;
            transition: all 0.3s ease;
        }
        .form-group input:focus,
        .form-group select:focus {
            border-color: var(--primary-color);
            outline: none;
            box-shadow: 0 0 0 2px rgba(37,99,235,0.1);
        }
        .error-message {
            color: red;
            text-align: center;
            margin-bottom: 15px;
            display: none;
        }
        .auth-form {
            display: none;
        }
        .auth-form.active {
            display: block;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <i class="fas fa-user-md"></i>
                <h2>Doctor Portal</h2>
                <p>Sign in or create an account</p>
            </div>
            
            <div class="form-tabs">
                <button class="active" onclick="switchTab('signup')">Sign Up</button>
                <button onclick="switchTab('login')">Sign In</button>
            </div>

            <div id="errorMsg" class="error-message"></div>

            <!-- Sign Up Form -->
            <form id="doctorSignupForm" class="auth-form active">
                <div class="form-group">
                    <input type="text" id="signupName" placeholder="Full Name (e.g. Dr. John Doe)" required>
                </div>
                <div class="form-group">
                    <input type="email" id="signupEmail" placeholder="Email Address" required>
                </div>
                <div class="form-group">
                    <input type="password" id="signupPassword" placeholder="Password" required>
                </div>
                <div class="form-group">
                    <select id="signupSpecialty" required>
                        <option value="">Select Specialty</option>
                        <option value="general">General Physician</option>
                        <option value="cardiology">Cardiology</option>
                        <option value="pediatrics">Pediatrics</option>
                        <option value="dermatology">Dermatology</option>
                    </select>
                </div>
                <div class="form-group">
                    <input type="text" id="signupClinic" placeholder="Clinic or Hospital Name" required>
                </div>
                <div class="form-group">
                    <input type="text" id="signupExperience" placeholder="Years of Experience (e.g. 10 years)" required>
                </div>
                <button type="submit" class="btn btn-primary btn-block">
                    Create Account
                </button>
            </form>

            <!-- Login Form -->
            <form id="doctorLoginForm" class="auth-form">
                <div class="form-group">
                    <input type="email" id="loginEmail" placeholder="Email Address" required>
                </div>
                <div class="form-group">
                    <input type="password" id="loginPassword" placeholder="Password" required>
                </div>
                <button type="submit" class="btn btn-primary btn-block">
                    Sign In
                </button>
            </form>

            <div style="text-align: center; margin-top: 20px;">
                <a href="index.html" style="color: var(--text-color); text-decoration: none;">&larr; Back to Home</a>
            </div>
        </div>
    </div>

    <script>
        function switchTab(tab) {
            document.querySelectorAll('.form-tabs button').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.auth-form').forEach(form => form.classList.remove('active'));
            document.getElementById('errorMsg').style.display = 'none';

            if(tab === 'signup') {
                document.querySelector('.form-tabs button:nth-child(1)').classList.add('active');
                document.getElementById('doctorSignupForm').classList.add('active');
            } else {
                document.querySelector('.form-tabs button:nth-child(2)').classList.add('active');
                document.getElementById('doctorLoginForm').classList.add('active');
            }
        }

        // Login Handler
        document.getElementById('doctorLoginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            const errorMsg = document.getElementById('errorMsg');
            
            try {
                const res = await fetch('/api/doctor/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                
                const data = await res.json();
                if (res.ok) {
                    window.location.href = 'doctor_dashboard.html';
                } else {
                    errorMsg.textContent = data.error || 'Login failed';
                    errorMsg.style.display = 'block';
                }
            } catch (err) {
                errorMsg.textContent = 'Network error. Please try again.';
                errorMsg.style.display = 'block';
            }
        });

        // Signup Handler
        document.getElementById('doctorSignupForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const payload = {
                name: document.getElementById('signupName').value,
                email: document.getElementById('signupEmail').value,
                password: document.getElementById('signupPassword').value,
                specialty: document.getElementById('signupSpecialty').value,
                clinic: document.getElementById('signupClinic').value,
                experience: document.getElementById('signupExperience').value
            };
            const errorMsg = document.getElementById('errorMsg');
            
            try {
                const res = await fetch('/api/doctor/signup', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                
                const data = await res.json();
                if (res.ok) {
                    window.location.href = 'doctor_dashboard.html';
                } else {
                    errorMsg.textContent = data.error || 'Registration failed';
                    errorMsg.style.display = 'block';
                }
            } catch (err) {
                errorMsg.textContent = 'Network error. Please try again.';
                errorMsg.style.display = 'block';
            }
        });
    </script>
</body>
</html>
